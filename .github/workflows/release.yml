name: Release

# Builds the assets and stamps the version first, then creates the tag on top
# of the result, so a tag always points at code that is already built and
# already says its own version. The tag is written once and never moved, which
# is what Composer's VCS repositories and Packagist expect of a tag.
#
# Run this from the Actions tab and give it the version to cut.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the version input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "${INPUT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be X.Y.Z with no leading 'v'. Got: '${INPUT_VERSION}'"
            exit 1
          fi
          echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${INPUT_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0

      # Tags are immutable here, so fail before anything is built rather than
      # after, and before a half-made release exists to clean up.
      - name: Check the tag is free
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists. Bump the version instead of moving it."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # main carries the literal `__VERSION__` in both places, so there is no
      # version to disagree with the tag until this writes one.
      - name: Stamp the version into the plugin
        run: |
          sed -i "s/__VERSION__/${VERSION}/g" button-block-icon.php
          grep -n "Version:\|const VERSION" button-block-icon.php

      - name: Create the release commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # build/ is gitignored in the source tree, so force-add it: the whole
          # point of the tag is that it is installable as it stands.
          git add -f build
          git add button-block-icon.php
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"

          # Push the tag and the objects it reaches, and nothing else. main is
          # left where it was.
          git push origin "refs/tags/${TAG}"

      # git archive honours the export-ignore rules in .gitattributes, so what
      # ships is defined in one place and cannot drift from the tagged tree.
      - name: Package
        run: |
          mkdir -p dist
          git archive --format=zip \
            --prefix=button-block-icon/ \
            -o "dist/button-block-icon-${VERSION}.zip" \
            "${TAG}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" "dist/button-block-icon-${VERSION}.zip" \
            --title "${VERSION}" \
            --generate-notes
